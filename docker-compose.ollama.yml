services:
  llm-worker:
    environment:
      LLM_PROVIDER: ollama
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-embeddinggemma:300m}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MAX_COMPLETION_TOKENS: ${OLLAMA_MAX_COMPLETION_TOKENS:-128}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      OLLAMA_EMBED_KEEP_ALIVE: ${OLLAMA_EMBED_KEEP_ALIVE:-0}
      OLLAMA_EMBED_CACHE_TTL_S: ${OLLAMA_EMBED_CACHE_TTL_S:-300}
      LLM_CONCURRENCY: ${LLM_CONCURRENCY:-1}
      LLM_JOB_TIMEOUT_S: ${LLM_JOB_TIMEOUT_S:-120}
      LLM_VISIBILITY_TIMEOUT_S: ${LLM_VISIBILITY_TIMEOUT_S:-300}
    extra_hosts:
      - host.docker.internal:host-gateway
