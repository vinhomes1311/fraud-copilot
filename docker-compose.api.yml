services:
  llm-worker:
    environment:
      LLM_PROVIDER: api
      LLM_API_BASE_URL: ${LLM_API_BASE_URL:?Set HTTPS API base URL including /v1 when required}
      LLM_API_MODEL: ${LLM_API_MODEL:?Set API model}
      LLM_API_KEY: ${LLM_API_KEY:?Set API key}
      LLM_API_RESPONSE_FORMAT: ${LLM_API_RESPONSE_FORMAT:-json_schema}
      LLM_API_TOKEN_PARAMETER: ${LLM_API_TOKEN_PARAMETER:-max_completion_tokens}
      LLM_API_MAX_COMPLETION_TOKENS: ${LLM_API_MAX_COMPLETION_TOKENS:-1024}
      LLM_RETRIEVER: ${LLM_RETRIEVER:-playbook}
      LLM_CONCURRENCY: ${LLM_CONCURRENCY:-1}
      LLM_JOB_TIMEOUT_S: ${LLM_JOB_TIMEOUT_S:-120}
      LLM_VISIBILITY_TIMEOUT_S: ${LLM_VISIBILITY_TIMEOUT_S:-300}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-embeddinggemma:300m}
    extra_hosts:
      - host.docker.internal:host-gateway
