name: Fraud Copilot CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fraud
          POSTGRES_PASSWORD: fraud
          POSTGRES_DB: fraud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fraud -d fraud"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      FRAUD_TEST_DB_URL: postgresql://fraud:fraud@localhost:5432/fraud
      FRAUD_TEST_REDIS_URL: redis://localhost:6379/0
      REDIS_URL: redis://localhost:6379/0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run automated tests
        run: python -m pytest -q

  docker-smoke:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build application images
        run: docker compose build analyst-api scoring-worker llm-worker model-service

      - name: Start API stack
        run: docker compose up -d redis postgres pgbouncer-write pgbouncer-read analyst-api nginx

      - name: Wait for health endpoint
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/healthz; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --tail 100 analyst-api nginx
          exit 1

      - name: Show service evidence
        run: |
          docker compose ps
          docker compose logs --tail 40 analyst-api

      - name: Stop stack
        if: always()
        run: docker compose down -v
