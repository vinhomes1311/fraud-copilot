name: Fraud Copilot CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Set up Node.js for dashboard tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check dashboard JavaScript and risk presentation
        run: |
          node --check static/app.js
          node --check static/risk-review.js
          node --test tests/ui/risk-review.test.cjs

  tests:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    needs: quality
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fraud
          POSTGRES_PASSWORD: fraud
          POSTGRES_DB: fraud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fraud -d fraud"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      FRAUD_TEST_DB_URL: postgresql://fraud:fraud@localhost:5432/fraud
      FRAUD_TEST_REDIS_URL: redis://localhost:6379/0
      REDIS_URL: redis://localhost:6379/0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run automated tests
        run: python -m pytest -q tests/unit_integration tests/ml_evaluation tests/e2e_smoke

  ml-evaluation:
    name: ML quality gate
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check committed ML baseline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("reports/ml-model-baseline.json").read_text())
          metrics = report["metrics"]
          minimums = report["minimums"]
          failed = [
              name for name, minimum in minimums.items()
              if metrics[name] < minimum
          ]
          if failed:
              raise SystemExit(f"ML quality gate failed: {', '.join(failed)}")
          print(json.dumps(report, indent=2))
          print("ML quality gate passed")
          PY

      - name: Upload ML evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: ml-model-evaluation
          path: reports/ml-model-baseline.json

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [quality, ml-evaluation]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build application images
        run: docker compose build analyst-api scoring-worker llm-worker model-service

  e2e-smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: [tests, docker-build, ml-evaluation]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build E2E service images
        run: docker compose build analyst-api scoring-worker llm-worker

      - name: Start API stack
        run: docker compose up -d redis postgres pgbouncer-write pgbouncer-read analyst-api scoring-worker llm-worker nginx

      - name: Wait for health endpoint
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/healthz; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --tail 100 analyst-api nginx
          exit 1

      - name: Verify worker containers
        shell: bash
        run: |
          for service in scoring-worker llm-worker; do
            for attempt in {1..30}; do
              if docker compose ps --status running --services | grep -qx "$service"; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                docker compose ps
                docker compose logs --tail 100 "$service"
                exit 1
              fi
              sleep 2
            done
          done

      - name: Run real transaction E2E test
        env:
          FRAUD_E2E_URL: http://localhost:8080
          SIMULATOR_API_KEY: dev-sim-key
        run: python -m pytest -q tests/e2e_smoke/test_transaction_e2e.py

      - name: Show service evidence
        run: |
          docker compose ps
          docker compose logs --tail 40 analyst-api scoring-worker llm-worker

      - name: Stop stack
        if: always()
        run: docker compose down -v
