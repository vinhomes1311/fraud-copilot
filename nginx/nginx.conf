worker_processes auto;
events { worker_connections 1024; }

http {
  # Rate limiting (FR-09): bảo vệ tài nguyên phía sau
  limit_req_zone $binary_remote_addr zone=api:10m rate=200r/s;
  limit_req_status 429;

  upstream analyst_api { server analyst-api:8000; }

  server {
    listen 80;
    client_max_body_size 64k;

    # Không lộ metrics ra ngoài
    location /metrics { return 404; }

    location = /healthz {
      proxy_pass http://analyst_api/healthz;
    }

    location /api/ {
      limit_req zone=api burst=400 nodelay;
      proxy_pass http://analyst_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # trace id xuyên suốt: Nginx -> API -> Redis job -> Worker -> DB
      proxy_set_header X-Request-Id $request_id;
      proxy_connect_timeout 2s;
      proxy_read_timeout 5s;
    }

    # Dashboard tĩnh được phục vụ bởi analyst-api.
    location / {
      proxy_pass http://analyst_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
