global:
  scrape_interval: 5s
scrape_configs:
  - job_name: analyst-api
    metrics_path: /metrics/
    static_configs: [{targets: ["analyst-api:8000"]}]
  - job_name: scoring-worker
    static_configs: [{targets: ["scoring-worker:9101"]}]
  - job_name: llm-worker
    static_configs: [{targets: ["llm-worker:9102"]}]
  - job_name: model-service
    metrics_path: /metrics
    static_configs: [{targets: ["model-service:8010"]}]
